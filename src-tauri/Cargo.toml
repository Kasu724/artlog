[package]
name = "artlog"
version = "0.1.0"
description = "Local-first history for digital art projects"
authors = ["ArtLog contributors"]
edition = "2021"
license = "MIT"

[workspace]
members = ["crates/core"]
default-members = ["."]
resolver = "2"

[lib]
name = "artlog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
artlog-core = { path = "crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
