[package]
name = "artlog"
version = "0.1.0"
description = "Local-first history for digital art projects"
authors = ["ArtLog contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "artlog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
